<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q&A Service</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        #question {
            flex: 1;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
        }
        #question:focus {
            border-color: #007bff;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #answer {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            min-height: 100px;
            white-space: pre-wrap;
        }
        .loading {
            color: #666;
            font-style: italic;
        }
        .error {
            color: #dc3545;
        }
    </style>
</head>
<body>
    <h1>Ask a Question</h1>
    <div class="input-container">
        <input type="text" id="question" placeholder="Enter your question" onkeypress="handleKeyPress(event)">
        <button id="submitBtn" onclick="submitQuestion()">Submit</button>
    </div>
    <div id="answer"></div>

    <script>
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                submitQuestion();
            }
        }

        async function submitQuestion() {
            const questionInput = document.getElementById('question');
            const answerDiv = document.getElementById('answer');
            const submitBtn = document.getElementById('submitBtn');

            const question = questionInput.value.trim();
            if (!question) {
                answerDiv.textContent = 'Please enter a question.';
                answerDiv.className = 'error';
                return;
            }

            // Show loading state
            submitBtn.disabled = true;
            submitBtn.textContent = 'Loading...';
            answerDiv.textContent = 'Thinking...';
            answerDiv.className = 'loading';

            try {
                const response = await fetch('/api/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ question: question })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                answerDiv.textContent = data.answer;
                answerDiv.className = '';
            } catch (error) {
                answerDiv.textContent = 'Error: ' + error.message;
                answerDiv.className = 'error';
            } finally {
                // Reset button state
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit';
            }
        }
    </script>
</body>
</html>
